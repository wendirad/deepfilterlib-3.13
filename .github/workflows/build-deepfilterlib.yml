name: build-deepfilterlib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # use ubuntu-24.04-arm for aarch64
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download sdist
        run: |
          pip download deepfilterlib==0.5.6 --no-binary :all: --no-deps -d dl
          tar xzf dl/*.tar.gz -C dl
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: dl/deepfilterlib-0.5.6
          manylinux: auto
          args: --release --out ../../dist -i python3.13
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: deepfilterlib-0.5.6
          files: dist/*.whl
